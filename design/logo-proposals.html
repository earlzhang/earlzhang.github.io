<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EarlMind 标识提案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
@theme {
  --color-paper: #EDEEEA;
  --color-ink: #17181A;
  --color-mute: #6B6D70;
  --color-line: #D3D4CF;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --font-sans: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  --font-display: "Instrument Serif", "Noto Serif SC", Georgia, serif;
}
.pixelated { image-rendering: pixelated; }
</style>
</head>
<body class="bg-paper text-ink font-sans antialiased">
<main class="mx-auto max-w-6xl px-5 py-12 md:py-16">
  <header class="mb-14 border-b border-line pb-8">
    <p class="font-mono text-xs uppercase tracking-[0.2em] text-mute">earlmind.com · identity study</p>
    <h1 class="mt-3 font-display text-5xl md:text-6xl">EarlMind 标识提案</h1>
    <p class="mt-4 max-w-2xl leading-relaxed text-mute">三个方向，全部由 Canvas 实时绘制。每套包含 favicon 尺寸阶梯、浏览器标签页实景和 1200×630 分享卡片，可单独导出 PNG。</p>
    <nav class="mt-6 flex flex-wrap gap-2 font-mono text-xs" id="toc"></nav>
  </header>
  <div id="proposals" class="space-y-24"></div>
</main>

<script>
const TAU = Math.PI * 2;
const TAG1 = '一半是对算力的好奇，';
const TAG2 = '一半是对生活的偏见';
const DPR = Math.min(window.devicePixelRatio || 1, 3);

const F = {
  mono: (w, s) => `${w} ${s}px "JetBrains Mono", ui-monospace, Menlo, monospace`,
  serif: (s, italic = false) => `${italic ? 'italic ' : ''}400 ${s}px "Instrument Serif", Georgia, serif`,
  sansSC: (w, s) => `${w} ${s}px "Noto Sans SC", "PingFang SC", sans-serif`,
  serifSC: (w, s) => `${w} ${s}px "Noto Serif SC", "Songti SC", serif`,
  grotesk: s => `800 ${s}px "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif`,
};

function tile(ctx, s, color, shape) {
  ctx.save();
  ctx.beginPath();
  shape === 'square' ? ctx.rect(0, 0, s, s) : ctx.roundRect(0, 0, s, s, s * 0.22);
  ctx.clip();
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, s, s);
}

function line(ctx, x0, y0, x1, y1) {
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
}

function mulberry32(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- A · 半像素 ---------- */
const A_C = { bg: '#2340C8', px: '#F5F7FF', warm: '#FFB38A' };
const A = {
  id: 'half-pixel', letter: 'A', cn: '半像素', en: 'Half-Pixel',
  concept: '取自站点副标题「一半是对算力的好奇，一半是对生活的偏见」。左半圆按 16×16 网格硬栅格化，代表算力；右半圆是平滑矢量，代表生活。',
  small: '所有尺寸共用同一张 16 格网格，16px 时左半的方块与屏幕像素一一对齐，没有任何简化。',
  palette: [['钴蓝', A_C.bg, '底色'], ['像素白', A_C.px, '算力的一半'], ['杏色', A_C.warm, '生活的一半']],
  mark(ctx, s, shape) {
    tile(ctx, s, A_C.bg, shape);
    const c = s / 16, R = 6, mid = Math.round(8 * c);
    if (s >= 96) {
      ctx.strokeStyle = 'rgba(255,255,255,.09)';
      ctx.lineWidth = Math.max(1, s / 256);
      for (let i = 1; i <= 8; i++) line(ctx, Math.round(i * c), 0, Math.round(i * c), s);
      for (let j = 1; j < 16; j++) line(ctx, 0, Math.round(j * c), mid, Math.round(j * c));
    }
    ctx.fillStyle = A_C.px;
    for (let i = 0; i < 8; i++) for (let j = 0; j < 16; j++) {
      const dx = i + 0.5 - 8, dy = j + 0.5 - 8;
      if (dx * dx + dy * dy > R * R) continue;
      const x0 = Math.round(i * c), x1 = Math.round((i + 1) * c), y0 = Math.round(j * c), y1 = Math.round((j + 1) * c);
      ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    }
    ctx.fillStyle = A_C.warm;
    ctx.beginPath(); ctx.arc(mid, 8 * c, R * c, -Math.PI / 2, Math.PI / 2); ctx.closePath(); ctx.fill();
    ctx.restore();
  },
  og(ctx, W, H) {
    ctx.fillStyle = A_C.bg; ctx.fillRect(0, 0, W, H);
    const c = 40, cx = 320, cy = 315, ox = cx - 8 * c, oy = cy - 8 * c, R = 6;
    ctx.strokeStyle = 'rgba(255,255,255,.09)'; ctx.lineWidth = 1;
    for (let x = ox + c; x <= cx; x += c) line(ctx, x + 0.5, 0, x + 0.5, H);
    for (let y = oy; y < H; y += c) if (y > 0) line(ctx, 0, y + 0.5, cx, y + 0.5);
    ctx.fillStyle = A_C.px;
    for (let i = 0; i < 8; i++) for (let j = 0; j < 16; j++) {
      const dx = i + 0.5 - 8, dy = j + 0.5 - 8;
      if (dx * dx + dy * dy <= R * R) ctx.fillRect(ox + i * c, oy + j * c, c, c);
    }
    ctx.fillStyle = A_C.warm;
    ctx.beginPath(); ctx.arc(cx, cy, R * c, -Math.PI / 2, Math.PI / 2); ctx.closePath(); ctx.fill();

    const x0 = 640, base = 272;
    const widths = S => {
      ctx.font = F.mono(600, S); const w1 = ctx.measureText('Earl').width;
      ctx.font = F.serif(S * 1.14, true); const w2 = ctx.measureText('Mind').width;
      return [w1, w1 + S * 0.04 + w2];
    };
    let S = 120;
    while (widths(S)[1] > 490 && S > 40) S -= 2;
    const [w1] = widths(S);
    ctx.textBaseline = 'alphabetic';
    ctx.font = F.mono(600, S); ctx.fillStyle = A_C.px; ctx.fillText('Earl', x0, base);
    ctx.font = F.serif(S * 1.14, true); ctx.fillStyle = A_C.warm; ctx.fillText('Mind', x0 + w1 + S * 0.04, base);
    ctx.font = F.sansSC(400, 34); ctx.fillStyle = 'rgba(245,247,255,.9)'; ctx.fillText(TAG1, x0 + 4, 362);
    ctx.font = F.serifSC(500, 34); ctx.fillStyle = A_C.warm; ctx.fillText(TAG2, x0 + 4, 414);
    ctx.font = F.mono(400, 20); ctx.fillStyle = 'rgba(245,247,255,.55)'; ctx.fillText('earlmind.com', x0 + 4, 552);
  },
};

/* ---------- B · 轸宿 ---------- */
// 轸宿四星与长沙按 J2000 赤经赤纬投影（东在左、北在上），单位：度
const CORVUS = {
  gamma: [4.365, 1.026], epsilon: [5.700, 6.104], delta: [1.063, 0], beta: [0, 6.881], zeta: [3.249, 5.700],
};
const CORVUS_W = 5.700, CORVUS_H = 6.881;
const B_C = { bg: '#17213F', star: '#F4E8C8', zhu: '#FF5A3C' };
function corvus(ctx, { ox, oy, k, lineW, lineA, r, glow, zeta }) {
  const P = n => [ox + CORVUS[n][0] * k, oy + CORVUS[n][1] * k];
  ctx.strokeStyle = `rgba(244,232,200,${lineA})`;
  ctx.lineWidth = lineW; ctx.lineJoin = 'round';
  ctx.beginPath();
  ['gamma', 'epsilon', 'beta', 'delta'].forEach((n, i) => { const [x, y] = P(n); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.closePath(); ctx.stroke();
  const star = (n, rr, color) => {
    const [x, y] = P(n);
    if (glow) { ctx.shadowColor = color; ctx.shadowBlur = rr * 2.5; }
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, rr, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
  };
  if (zeta) star('zeta', r * 0.45, 'rgba(244,232,200,.85)');
  star('epsilon', r * 0.92, B_C.star);
  star('delta', r * 0.94, B_C.star);
  star('beta', r, B_C.star);
  star('gamma', r * 1.25, B_C.zhu);
  return P;
}
const B = {
  id: 'chariot', letter: 'B', cn: '轸宿', en: 'The Chariot',
  concept: '张、翼、轸恰是南方朱雀第五、六、七宿。标识取轸宿四星（γ、ε、δ、β Crv），按真实赤经赤纬投影连线，最亮的轸宿一用朱色点出；大尺寸下补上四边形中的长沙星。',
  small: '≤48px 时放大星点、加粗连线并隐去长沙星，四点一线框在 16px 仍是清楚的梯形。',
  palette: [['黛蓝', B_C.bg, '夜空'], ['星白', B_C.star, '轸宿二至四'], ['朱', B_C.zhu, '轸宿一 · 朱雀']],
  mark(ctx, s, shape) {
    tile(ctx, s, B_C.bg, shape);
    if (s >= 64) {
      const g = ctx.createRadialGradient(s * 0.32, s * 0.28, 0, s * 0.5, s * 0.5, s * 0.8);
      g.addColorStop(0, 'rgba(80,110,190,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
    }
    const small = s <= 48;
    const k = s * (small ? 0.66 : 0.58) / CORVUS_H;
    corvus(ctx, {
      ox: (s - CORVUS_W * k) / 2, oy: (s - CORVUS_H * k) / 2, k,
      lineW: small ? Math.max(1, s * 0.06) : s * 0.012,
      lineA: small ? 0.75 : 0.45,
      r: small ? s * 0.085 : s * 0.038,
      glow: !small, zeta: !small,
    });
    ctx.restore();
  },
  og(ctx, W, H) {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#0F1730'); g.addColorStop(1, '#1D2B57');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const rnd = mulberry32(7);
    for (let i = 0; i < 260; i++) {
      const x = rnd() * W, y = rnd() * H, r = rnd() ** 3 * 1.4 + 0.3, a = 0.1 + rnd() * 0.4;
      ctx.fillStyle = `rgba(244,232,200,${a})`; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    }
    const k = 400 / CORVUS_H, cx = 895, cy = 315;
    ctx.strokeStyle = 'rgba(244,232,200,.1)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, 285, 0, TAU); ctx.stroke();
    const P = corvus(ctx, { ox: cx - CORVUS_W * k / 2, oy: cy - CORVUS_H * k / 2, k, lineW: 2, lineA: 0.45, r: 9, glow: true, zeta: true });
    ctx.font = F.serifSC(500, 18); ctx.fillStyle = 'rgba(244,232,200,.55)';
    const label = (n, text, dx, dy, align) => { const [x, y] = P(n); ctx.textAlign = align; ctx.fillText(text, x + dx, y + dy); };
    label('gamma', '轸宿一', 20, -10, 'left');
    label('epsilon', '轸宿二', 18, 26, 'left');
    label('delta', '轸宿三', -18, -10, 'right');
    label('beta', '轸宿四', -18, 26, 'right');
    label('zeta', '长沙', 0, -14, 'center');
    ctx.textAlign = 'left';

    let S = 136;
    ctx.font = F.serif(S);
    while (ctx.measureText('EarlMind').width > 520 && S > 40) { S -= 2; ctx.font = F.serif(S); }
    ctx.fillStyle = B_C.star; ctx.fillText('EarlMind', 80, 282);
    ctx.font = F.serifSC(500, 32); ctx.fillStyle = 'rgba(244,232,200,.9)';
    ctx.fillText(TAG1, 86, 362); ctx.fillText(TAG2, 86, 410);
    ctx.font = F.serifSC(500, 18); ctx.fillStyle = 'rgba(244,232,200,.5)';
    ctx.fillText('张 · 翼 · 轸　南方朱雀第五、六、七宿', 86, 540);
    ctx.font = F.mono(400, 18); ctx.fillText('earlmind.com', 86, 572);
  },
};

/* ---------- C · 偏心 ---------- */
const C_C = { bg: '#F2B02E', ink: '#1B1A17' };
function offCenter(ctx, cx, cy, R, w, dr, gap) {
  ctx.strokeStyle = C_C.ink; ctx.fillStyle = C_C.ink; ctx.lineWidth = w;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
  const d = R - w / 2 - gap - dr, a = -Math.PI / 4;
  ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, dr, 0, TAU); ctx.fill();
}
const C = {
  id: 'off-center', letter: 'C', cn: '偏心', en: 'Off-Center',
  concept: '偏见，就是视角离开了圆心。圆环中的点向右上偏移，像一道好奇的目光；字标里 i 的点也同样偏了出去。',
  small: '≤32px 时加粗圆环、取消内侧间隙，让偏移在 16px 下仍有约 1.5 个像素可辨。姜黄底在浅色与深色标签栏里都醒目。',
  palette: [['姜黄', C_C.bg, '底色'], ['墨', C_C.ink, '圆环与偏心点']],
  mark(ctx, s, shape) {
    tile(ctx, s, C_C.bg, shape);
    s <= 32
      ? offCenter(ctx, s / 2, s / 2, s * 0.31, s * 0.12, s * 0.11, 0)
      : offCenter(ctx, s / 2, s / 2, s * 0.29, s * 0.1, s * 0.11, s * 0.025);
    ctx.restore();
  },
  og(ctx, W, H) {
    ctx.fillStyle = C_C.bg; ctx.fillRect(0, 0, W, H);
    const R = 260;
    offCenter(ctx, 1060, 292, R, R * 0.1 / 0.29, R * 0.11 / 0.29, R * 0.025 / 0.29);

    ctx.fillStyle = C_C.ink;
    ctx.font = F.mono(400, 20); ctx.globalAlpha = 0.7; ctx.fillText('earlmind.com', 76, 88); ctx.globalAlpha = 1;
    const parts = ['earlm', 'ı', 'nd'];
    let S = 168;
    const total = () => { ctx.font = F.grotesk(S); return ctx.measureText(parts.join('')).width; };
    while (total() > 640 && S > 40) S -= 2;
    const base = 430;
    let x = 72;
    ctx.font = F.grotesk(S);
    const w0 = ctx.measureText(parts[0]).width, wi = ctx.measureText(parts[1]).width;
    ctx.fillText(parts.join(''), x, base);
    const ix = x + w0 + wi / 2;
    ctx.beginPath(); ctx.arc(ix + S * 0.19, base - S * 0.8, S * 0.088, 0, TAU); ctx.fill();
    ctx.font = F.sansSC(700, 30); ctx.fillText(TAG1 + TAG2, 78, 520);
  },
};

const PROPOSALS = [A, B, C];
const EXPORTS = [
  { file: 'favicon-16.png', s: 16, shape: 'round' },
  { file: 'favicon-32.png', s: 32, shape: 'round' },
  { file: 'apple-touch-icon.png', s: 180, shape: 'square' },
  { file: 'icon-512.png', s: 512, shape: 'square' },
  { file: 'og-image.png', og: true },
];

/* ---------- 渲染 ---------- */
function markCanvas(p, px, css, shape = 'round', extra = '') {
  const c = document.createElement('canvas');
  c.width = c.height = px;
  c.style.width = c.style.height = css + 'px';
  if (extra) c.className = extra;
  p.mark(c.getContext('2d'), px, shape);
  return c;
}

function ogCanvas(p) {
  const c = document.createElement('canvas');
  c.width = 1200; c.height = 630;
  c.className = 'block h-auto w-full';
  p.og(c.getContext('2d'), 1200, 630);
  return c;
}

function download(canvas, name) {
  canvas.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
}

function sectionHTML(p) {
  return `
  <section id="${p.id}" class="scroll-mt-8">
    <div class="flex flex-wrap items-baseline gap-x-4 gap-y-1 border-b border-line pb-3">
      <span class="font-mono text-xs text-mute">方案 ${p.letter}</span>
      <h2 class="font-display text-4xl md:text-5xl">${p.cn} <span class="italic text-mute">${p.en}</span></h2>
    </div>
    <div class="mt-8 grid gap-10 lg:grid-cols-12">
      <div class="space-y-6 lg:col-span-4">
        <p class="leading-relaxed">${p.concept}</p>
        <div>
          <p class="font-mono text-[11px] uppercase tracking-[0.18em] text-mute">小尺寸</p>
          <p class="mt-1 text-sm leading-relaxed text-mute">${p.small}</p>
        </div>
        <ul class="space-y-2" data-slot="palette"></ul>
        <div>
          <p class="font-mono text-[11px] uppercase tracking-[0.18em] text-mute">导出 PNG</p>
          <div data-slot="export" class="mt-2 flex flex-wrap gap-2"></div>
        </div>
      </div>
      <div class="space-y-8 lg:col-span-8">
        <figure>
          <div data-slot="og" class="overflow-hidden rounded-xl shadow-sm ring-1 ring-black/10"></div>
          <figcaption class="mt-2 font-mono text-xs text-mute">OG 卡片 · 1200 × 630</figcaption>
        </figure>
        <div data-slot="ladder" class="flex flex-wrap items-end gap-x-6 gap-y-4"></div>
        <div data-slot="tabs" class="grid gap-3 md:grid-cols-2"></div>
      </div>
    </div>
  </section>`;
}

function ladderItem(canvas, label) {
  const d = document.createElement('div');
  d.className = 'flex flex-col items-center gap-2';
  d.append(canvas);
  const s = document.createElement('span');
  s.className = 'font-mono text-[11px] text-mute';
  s.textContent = label;
  d.append(s);
  return d;
}

function tabBar(p, dark) {
  const bar = document.createElement('div');
  bar.className = 'flex items-end gap-1 rounded-lg px-2 pt-2';
  bar.style.background = dark ? '#202124' : '#DEE1E6';
  const tab = (active, title, icon) => {
    const t = document.createElement('div');
    t.className = 'flex min-w-0 flex-1 items-center gap-2 rounded-t-lg px-3 py-2 text-[12px]';
    t.style.background = active ? (dark ? '#35363A' : '#FFFFFF') : 'transparent';
    t.style.color = dark ? (active ? '#E8EAED' : '#9AA0A6') : (active ? '#202124' : '#5F6368');
    t.append(icon);
    const span = document.createElement('span');
    span.className = 'truncate'; span.style.fontFamily = 'system-ui, sans-serif'; span.textContent = title;
    t.append(span);
    return t;
  };
  const dummy = document.createElement('span');
  dummy.className = 'inline-block h-4 w-4 shrink-0 rounded-full';
  dummy.style.background = dark ? '#5F6368' : '#BDC1C6';
  const fav = markCanvas(p, Math.round(16 * DPR), 16);
  fav.classList.add('shrink-0');
  bar.append(tab(true, 'EarlMind', fav), tab(false, 'GitHub', dummy));
  return bar;
}

function renderAll() {
  const root = document.getElementById('proposals');
  root.innerHTML = PROPOSALS.map(sectionHTML).join('');
  document.getElementById('toc').innerHTML = PROPOSALS.map(p =>
    `<a href="#${p.id}" class="rounded-full border border-ink/20 px-3 py-1 hover:bg-ink hover:text-paper focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">${p.letter} · ${p.cn}</a>`
  ).join('');

  PROPOSALS.forEach(p => {
    const sec = document.getElementById(p.id);
    const slot = n => sec.querySelector(`[data-slot="${n}"]`);

    slot('og').append(ogCanvas(p));

    const lad = slot('ladder');
    lad.append(
      ladderItem(markCanvas(p, Math.round(128 * DPR), 128), '512'),
      ladderItem(markCanvas(p, Math.round(60 * DPR), 60), '180'),
      ladderItem(markCanvas(p, Math.round(32 * DPR), 32), '32'),
      ladderItem(markCanvas(p, 16, 16), '16 实际'),
      ladderItem(markCanvas(p, 16, 64, 'round', 'pixelated'), '16 ×4'),
    );

    slot('tabs').append(tabBar(p, false), tabBar(p, true));

    slot('palette').innerHTML = p.palette.map(([name, hex, role]) => `
      <li class="flex items-center gap-3">
        <span class="h-8 w-8 shrink-0 rounded-md ring-1 ring-black/10" style="background:${hex}"></span>
        <span class="text-sm">${name}</span>
        <span class="font-mono text-xs text-mute">${hex}</span>
        <span class="ml-auto text-xs text-mute">${role}</span>
      </li>`).join('');

    const ex = slot('export');
    EXPORTS.forEach(e => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'rounded-full border border-ink/20 px-3 py-1.5 font-mono text-xs transition-colors hover:bg-ink hover:text-paper focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink';
      b.textContent = e.file;
      b.addEventListener('click', () => download(e.og ? ogCanvas(p) : markCanvas(p, e.s, e.s, e.shape), `${p.id}-${e.file}`));
      ex.append(b);
    });
  });
}

const FONT_SPECS = [
  '600 40px "JetBrains Mono"', '400 40px "JetBrains Mono"',
  'italic 400 40px "Instrument Serif"', '400 40px "Instrument Serif"',
  '800 40px "Bricolage Grotesque"',
  '400 40px "Noto Sans SC"', '700 40px "Noto Sans SC"', '500 40px "Noto Serif SC"',
];
const SAMPLE = 'EarlMind earlmınd.com ' + TAG1 + TAG2 + '张翼轸南方朱雀第五、六七宿一二三四长沙 ·';

renderAll();
Promise.race([
  Promise.all(FONT_SPECS.map(f => document.fonts.load(f, SAMPLE))),
  new Promise(r => setTimeout(r, 4000)),
]).catch(() => {}).finally(() => {
  renderAll();
  document.fonts.ready.then(renderAll);
});
</script>
