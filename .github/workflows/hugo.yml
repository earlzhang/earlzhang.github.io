name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[deploy-docs]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --config hugo.toml --minify

      - name: Commit and push docs
        run: |
          rm -rf docs
          cp -r public docs
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add docs
          git diff --cached --quiet || git commit -m "[deploy-docs] Update GitHub Pages content"
          git push
